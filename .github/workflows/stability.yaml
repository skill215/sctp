name: stability native validation
on:
  push:
    branches: ['codex/fix-v0-7-2-stability']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        go: [1.26.x, 1.27.x]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: sudo modprobe sctp
      - run: uname -a && go version
      - run: go test -race -run '^TestStabilityAssociationStatusProbe$' -count=3 -v -timeout=60s .
