name: release
on:
  push:
    branches: [master]
    paths: ['releases/*.md']
    tags: ['0.*', 'v0.*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yaml
  publish:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: false
      - name: Publish validated annotated tags
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags=("$GITHUB_REF_NAME")
            git fetch origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          else
            # New canonical release notes authorize publication from this
            # validated master commit. Editing existing notes creates no tag.
            mapfile -t notes < <(git diff --diff-filter=A --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- 'releases/v*.md')
            tags=()
            for note in "${notes[@]}"; do
              tag="$(basename "$note" .md)"
              [[ "$tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
              test -s "$note"
              # Refuse to move or replace any pre-existing tag.
              if git show-ref --verify --quiet "refs/tags/$tag"; then
                echo "Tag already exists: $tag" >&2
                exit 1
              fi
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" "$GITHUB_SHA" -F "$note"
              git push origin "refs/tags/$tag"
              tags+=("$tag")
            done
          fi
          for tag in "${tags[@]}"; do
            test "$(git cat-file -t "refs/tags/$tag")" = tag
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"
            git for-each-ref --format='%(contents)' "refs/tags/$tag" > "$RUNNER_TEMP/release-notes.md"
            test -s "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$tag"
            checkdir="$(mktemp -d)"
            (
              cd "$checkdir"
              go mod init example.com/release-verification
              GOPROXY=direct go get "github.com/skill215/sctp@$tag"
              actual="$(go list -m -f '{{.Version}}' github.com/skill215/sctp)"
              test "$actual" = "$tag"
            )
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$RUNNER_TEMP/tag.json"
            gh release view "$tag" --json tagName,targetCommitish,url
          done
  notes:
    if: github.ref_type == 'branch'
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for notes in releases/*.md; do
            tag="$(basename "$notes" .md)"
            test -s "$notes"
            gh release edit "$tag" --notes-file "$notes"
          done
