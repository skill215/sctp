name: ci

on:
  pull_request:
    branches:
      - master

jobs:
  arch:
    uses: ./.github/workflows/arch.yaml

  test:
    strategy:
      matrix:
        go: [1.26.x, 1.27.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
          go-version: ${{ matrix.go }}
    - run: go test -race ./...
